name: Bug report
description: Report a reproducible TabTelly problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove pairing codes, tokens, peer IDs, addresses, device names, and runtime secrets. Report vulnerabilities privately as described in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: TabTelly version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Computer OS, Python and Chrome versions, plus TV model, firmware, and browser user agent when relevant.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Give the smallest complete sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Relevant `tabtelly doctor`, status, or log output with private network and session data removed.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed codes, secrets, peer IDs, addresses, and private device names.
          required: true
        - label: This is not a security vulnerability.
          required: true
