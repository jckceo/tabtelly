<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">TabTelly — your browser tab, on the TV</title><desc id="desc">An experimental local WebRTC casting utility. Chrome tab with audio to a compatible TV browser. No TV app or cloud relay.</desc>
