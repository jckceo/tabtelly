<g fill="#173e32" font-family="Arial,Helvetica,sans-serif"><text x="80" y="118" font-size="30" font-weight="700" letter-spacing="1">TABTELLY</text><text x="76" y="260" font-size="76" font-weight="700" letter-spacing="-3">Your browser tab.</text><text x="76" y="346" font-size="76" font-weight="700" letter-spacing="-3">On the TV.</text><text x="80" y="428" font-size="27">Chrome tab + audio → compatible TV browser</text><text x="80" y="470" font-size="27">Local Wi-Fi. WebRTC. No TV app.</text><text x="80" y="565" font-size="19" letter-spacing="1">OPEN SOURCE · EXPERIMENTAL 0.1.0 · MIT LICENSE</text></g>
